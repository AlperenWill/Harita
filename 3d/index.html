<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191512" />
    <meta name="description" content="Türkiye'nin tarihî ve kültürel mirasını 3D harita üzerinde keşfet." />
    <title>Miras. Haritası</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/data/tr-low.topo.json" as="fetch" type="application/json" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <style>
      /* Kritik CSS: JS gelmeden önce görünen marka ekranı */
      html, body { margin: 0; height: 100%; background: #191512; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50;
        background: #191512; color: #f3ebe0; font: 600 15px/1.4 Manrope, system-ui, sans-serif;
        letter-spacing: .08em; transition: opacity .6s ease .1s; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .ring { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%;
        border: 2px solid #3a332d; border-top-color: #4fb3a9; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div><div class="ring"></div><span style="font-size:22px;letter-spacing:0"><span style="color:#F04448">M</span>iras<span style="color:#F04448">.</span> Haritası</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main3d.tsx"></script>
  </body>
</html>
